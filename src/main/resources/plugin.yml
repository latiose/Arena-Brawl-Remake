name: ArenaBrawl
version: '1.0'
main: org.latios.arenaBrawl.ArenaBrawlPlugin
api-version: '26.2'
load: POSTWORLD
softdepend: [LibsDisguises]
commands:
  party:
    description: Manage your party
    usage: /party <invite|accept|leave> [player]
  queue:
    description: Leave or join the queue
    usage: /queue <join|leave>
  abilities:
    description: Select your abilities
    usage: /abilities
    rating:
      description: Shows a player's rating
      usage: /rating <name>
  leaderboard:
    description: Shows the top 10 highest rated players
    usage: /leaderboard